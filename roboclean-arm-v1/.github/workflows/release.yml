name: Release (exécutables)
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix: { os: [windows-latest, ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pyserial
      - run: pyinstaller --onefile --name roboclean-${{ matrix.os }} roboclean_controle.py
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
